# Third-party target: Jenkins (legacy jQuery UI, iframes, Java).
#
# The deliberately awkward one. Jenkins is ubiquitous, its UI predates the
# SPA era, and it leans on iframes, framesets and jQuery widgets that modern
# targets avoid — exactly the material that finds bugs. If browser-pilot
# drives Jenkins it will drive most internal tools.
#
# The setup wizard is disabled so the instance comes up reproducibly rather
# than demanding a secret pasted from the container log.
#
#   up:  docker compose -f bench/thirdparty/jenkins/docker-compose.yml up -d
#   web: http://127.0.0.1:8085
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
volumes:
  jenkins-data:
