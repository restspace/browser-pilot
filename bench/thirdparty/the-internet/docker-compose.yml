# Purpose-built widget torture test: "the-internet" (Sinatra, tiny).
#
# Not an application — a catalogue of the individual affordances that break
# browser automation, each on its own page: iframes, nested frames, shadow
# DOM, JS alerts/confirms/prompts, dynamic loading, drag and drop, file
# upload/download, infinite scroll, hovers, basic auth, disappearing elements.
# The other targets exercise these incidentally and in combination; this one
# isolates them, so when a flow fails elsewhere we can tell WHICH affordance
# did it.
#
#   up:  docker compose -f bench/thirdparty/the-internet/docker-compose.yml up -d
#   web: http://127.0.0.1:7080
services:
  the-internet:
    image: gprestes/the-internet:latest
    ports:
      - "127.0.0.1:7080:5000"
