# Third-party target: Gitea (Go, server-rendered templates + Vue islands).
#
# Covers a shape none of the others do: mostly server-rendered HTML with
# islands of client framework, plus the affordances of a real dev tool —
# nested navigation, markdown editors, file trees, diff views, long tables.
# Single container on sqlite; INSTALL_LOCK skips the web installer so the
# instance is reproducible rather than hand-clicked.
#
#   up:   docker compose -f bench/thirdparty/gitea/docker-compose.yml up -d
#   seed: bash bench/thirdparty/gitea/seed.sh
#   web:  http://127.0.0.1:3001   (bench / bench-pass-1234)
services:
  gitea:
    image: gitea/gitea:1.22
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://127.0.0.1:3001/
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - gitea-data:/data
volumes:
  gitea-data:
